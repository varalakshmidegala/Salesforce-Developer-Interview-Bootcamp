<template>
    <lightning-card title="Offer Summary">

        <div class="slds-p-around_medium">

            <template if:true={applications.length}>

                <template for:each={applications} for:item="application">

                    <div key={application.Id}
                         class="slds-box slds-m-bottom_small">

                        <h2 class="slds-text-heading_medium">
                            {application.Job__r.Name}
                        </h2>

                        <p>
                            <strong>Company:</strong>
                            {application.Job__r.Company__c}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            {application.Job__r.Location__c}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            {application.Status__c}
                        </p>

                    </div>

                </template>

            </template>

            <template if:false={applications.length}>
                <p>No offers received yet.</p>
            </template>

        </div>

    </lightning-card>
</template>
