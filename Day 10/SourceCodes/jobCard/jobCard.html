<template>

    <lightning-card title={job.Name}>

        <div class="slds-p-around_medium">

            <p>
                <strong>Company:</strong>
                {job.Company__c}
            </p>

            <p>
                <strong>Location:</strong>
                {job.Location__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong>
                {job.Minimum_CGPA__c}
            </p>

            <p>
                <strong>Closing Date:</strong>
                {job.Closing_Date__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    onclick={handleViewDetails}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    label="Apply"
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
